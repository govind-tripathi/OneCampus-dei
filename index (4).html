    <style type="text/tailwindcss">
@custom-variant dark (&:where(.dark, .dark *));

@layer base {
  html {
    scroll-behavior: smooth;
  }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  h1, h2, h3, h4, .font-heading {
    font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
  }
  code, pre, .font-mono {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
}

@keyframes floatSlow {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-4px); }
}

@keyframes pingSmall {
  0% { transform: scale(1); opacity: 0.85; }
  75%, 100% { transform: scale(1.9); opacity: 0; }
}

@keyframes occupiedPulse {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 0.95; }
}

@keyframes welcomeFadeUp {
  0% {
    opacity: 0;
    transform: translateY(14px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes auraDrift {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(12px, -8px, 0) scale(1.04); }
}

.animate-float {
  animation: floatSlow 3.2s ease-in-out infinite;
}

.animate-ping-small {
  transform-box: fill-box;
  transform-origin: center;
  animation: pingSmall 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
}

.animate-occupied-pulse {
  animation: occupiedPulse 2.2s ease-in-out infinite;
}

.animate-welcome {
  animation: welcomeFadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.animate-welcome-delay {
  animation: welcomeFadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
}

.animate-aura {
  animation: auraDrift 8s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  .animate-float,
  .animate-ping-small,
  .animate-occupied-pulse,
  .animate-welcome,
  .animate-welcome-delay,
  .animate-aura {
    animation: none !important;
  }
}

/* Subtle Custom Scrollbar */
.scrollbar-thin::-webkit-scrollbar {
  height: 6px;
  width: 6px;
}
.scrollbar-thin::-webkit-scrollbar-track {
  background: transparent;
}
.scrollbar-thin::-webkit-scrollbar-thumb {
  background: rgba(99, 102, 241, 0.35);
  border-radius: 9999px;
}
.scrollbar-thin::-webkit-scrollbar-thumb:hover {
  background: rgba(79, 70, 229, 0.6);
}
</style>
