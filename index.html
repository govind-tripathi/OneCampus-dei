      const toCamelCaseAttrs = (obj) => {
        const out = {};
        for (const k in obj) {
          const camelKey = k.replace(/-([a-z])/g, (_, ch) => ch.toUpperCase());
          out[camelKey] = obj[k];
        }
        return out;
      };

      function LucideSvg({ iconName, className = 'w-4 h-4', ...rest }) {
        const iconData = window.lucide && window.lucide[iconName];
        if (!iconData) return null;
        const [, attrs, children] = iconData;
        return (
          <svg
            xmlns={attrs.xmlns}
            width={attrs.width}
            height={attrs.height}
            viewBox={attrs.viewBox}
            fill={attrs.fill}
            stroke={attrs.stroke}
            strokeWidth={attrs['stroke-width']}
            strokeLinecap={attrs['stroke-linecap']}
            strokeLinejoin={attrs['stroke-linejoin']}
            className={`lucide shrink-0 ${className}`}
            {...rest}
          >
            {children.map(([tag, childAttrs], idx) =>
              React.createElement(tag, { key: idx, ...toCamelCaseAttrs(childAttrs) })
            )}
          </svg>
        );
      }

if (session_status() === PHP_SESSION_NONE) {
    session_start();
}

define('DB_NAME', 'onecampus');
define('DB_PORT', 3306);

mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);

try {
    $conn = new mysqli(DB_HOST, DB_USER, DB_PASS, DB_NAME, DB_PORT);
    $conn->set_charset('utf8mb4');
} catch (mysqli_sql_exception $e) {
    die("Database connection failed: " . htmlspecialchars($e->getMessage()));
}

function clean($data) {
    global $conn;
    $data = trim($data);
    $data = stripslashes($data);
    $data = htmlspecialchars($data, ENT_QUOTES, 'UTF-8');
    return $conn->real_escape_string($data);

    $_SESSION['flash_message'] = ['text' => $message, 'type' => $type];

    if (isset($_SESSION['flash_message'])) {
        $msg = $_SESSION['flash_message'];
        unset($_SESSION['flash_message']);
        return $msg;
    }
    return null;
}

function is_logged_in() {
    return isset($_SESSION['user_id']) && !empty($_SESSION['user_id']);
}

function current_user() {
    global $conn;
    if (!is_logged_in()) return null;
    $stmt = $conn->prepare("SELECT id, full_name, roll_no, department, email, role, skill_credits, green_points, avatar_seed, created_at FROM users WHERE id = ?");
    $stmt->bind_param("i", $_SESSION['user_id']);
    $stmt->execute();
    return $stmt->get_result()->fetch_assoc();
}

    if (!is_logged_in()) {
        set_flash("Please login to access the ONECAMPUS portal.", "warning");
        header("Location: login.php");
        exit;
    }
}

function require_admin() {
    require_login();
    $user = current_user();
    if ($user['role'] !== 'admin') {
        set_flash("Unauthorized: Admin privileges required.", "danger");
        header("Location: index.php");
        exit;
    }
}

          let matched;
          if (floorRoom.matchedRoomId) {
            matched = rooms.find(r => r.id === floorRoom.matchedRoomId);
          } else {
            matched = rooms.find(r => r.roomName.toLowerCase().includes(floorRoom.name.toLowerCase()));
          }

          if (matched) {
            return {
              matchedId: matched.id,
              status: matched.status,
              activity: matched.currentActivity,
              updatedAt: matched.updatedAt,
              capacity: matched.capacity,
              isMatched: true
            };
          }

          return {
            matchedId: null,
            status: floorRoom.id % 2 === 0 ? 'Occupied' : 'Available',
            activity: floorRoom.id % 2 === 0 ? 'Scheduled Class Session' : 'Free for Self Study',
            updatedAt: '10 mins ago',
            capacity: floorRoom.capacity,
            isMatched: false

        const facilityRooms = layout.rooms;
        const availCount = facilityRooms.filter(r => getRoomLiveState(r).status === 'Available').length;

      function DeployGuideModal({ isOpen, onClose, onShowToast }) {
        if (!isOpen) return null;

        const handleDownloadSingleHtml = () => {
          try {
            const clone = document.documentElement.cloneNode(true);
            // Strip any Vite dev client injection if served through Vite dev server
            clone.querySelectorAll('script[src*="/@vite/client"], script[src*="@react-refresh"], script[type="module"][src*="vite"]').forEach(el => el.remove());
            // Strip Tailwind runtime-generated <style> tags (preserve original <style type="text/tailwindcss">)
            clone.querySelectorAll('style:not([type="text/tailwindcss"])').forEach(el => el.remove());
            // Strip Babel runtime-injected compiled inline <script> tags
            clone.querySelectorAll('script:not([src]):not([type="text/babel"])').forEach(el => el.remove());
            clone.classList.remove('dark');
            const rootEl = clone.querySelector('#root');
            if (rootEl) {
              rootEl.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#059669;font-weight:700;"><span>Loading ONECAMPUS (DEI Edition)...</span></div>';
            }
            const htmlText = '<!doctype html>\n' + clone.outerHTML;
            const blob = new Blob([htmlText], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            a.click();
            URL.revokeObjectURL(url);
            onShowToast('Single standalone index.html downloaded! Works anywhere without build step.', 'success');

            onShowToast('Could not generate download automatically.', 'danger');

                            </button>
                            <button
                              onClick={() => setEcoView('feed')}
                              className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors ${
                                ecoView === 'feed' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 shadow-2xs' : 'text-slate-600 dark:text-slate-400'
                              }`}
                            >
                              Feed List
                            </button>
                          </div>
                          <span className="text-xs text-slate-500 dark:text-slate-400 font-medium hidden sm:inline">
                            {reports.filter(r => r.status === 'Open').length} Open Campus Tickets
                          </span>
                        </div>
                      </div>

                      {(ecoView === 'map' || ecoView === 'both') && (
                        <EcoPulseMap
                          reports={reports}
                          onResolveReport={handleResolveReport}
                          isAdmin={isAdmin}
                        />
                      )}

                      {(ecoView === 'feed' || ecoView === 'both') && (
                        <div className="space-y-4">
                          {filteredReports.length === 0 ? (
                            <div className="bg-white dark:bg-slate-900 rounded-2xl p-8 border border-slate-200 dark:border-slate-800 text-center text-xs text-slate-400">
                              No reports matched your search keyword "{globalSearchQuery}".
                            </div>
                          ) : (
                            filteredReports.map(rep => {
                              const isOpen = rep.status === 'Open';
                              return (
                                <div
                                  key={rep.id}
                                  className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-xs hover:border-slate-300 dark:hover:border-slate-700 transition-all flex flex-col justify-between"
                                >
                                  <div>
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2">
                                      <div className="flex items-center gap-2">
                                        <span className={`text-xs px-2.5 py-0.5 rounded-full font-semibold ${
                                          isOpen ? 'bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-400 border border-rose-200 dark:border-rose-800' : 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800'
                                        }`}>
                                          {rep.status}
                                        </span>
                                        <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">
                                          Category: <strong className="text-slate-700 dark:text-slate-200">{rep.issueCategory}</strong>
                                        </span>
                                      </div>
                                      <span className="text-[11px] text-slate-400">
                                        Reported by {rep.userName} ({rep.userDepartment}) · {rep.createdAt}
                                      </span>
                                    </div>
                                    <h3 className="font-bold text-slate-900 dark:text-white text-base mb-1">
                                      📍 {rep.location}
                                    </h3>
                                    <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed mb-3">
                                      {rep.description}
                                    </p>
                                  </div>
                                  <div className="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                                    <span className="text-xs text-emerald-700 dark:text-emerald-400 font-medium flex items-center gap-1">
                                      <Award className="w-3.5 h-3.5" /> +10 Green Points upon resolution
                                    </span>
                                    {isOpen ? (
                                      isAdmin ? (
                                        <button
                                          onClick={() => handleResolveReport(rep.id)}
                                          className="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white shadow-2xs transition-colors flex items-center gap-1.5"
                                        >
                                          <Check className="w-3.5 h-3.5" />
                                          <span>Mark Resolved (+10 Karma)</span>
                                        </button>
                                      ) : (
                                        <span className="text-xs text-slate-400 italic">
                                          Awaiting Faculty Caretaker inspection
                                        </span>
                                      )
                                    ) : (
                                      <span className="text-xs text-emerald-700 dark:text-emerald-400 font-semibold flex items-center gap-1">
                                        <CheckCircle2 className="w-4 h-4 text-emerald-600" />
                                        Resolved &amp; Awarded
                                      </span>
                                    )}
                                  </div>
                                </div>
                              );
                            })
                          )}
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* SIDEBAR */}
                <div className="lg:col-span-4 space-y-6">
                  {/* Trivia Spin-Wheel */}
                  <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-xs transition-colors">
                    <div className="flex items-center justify-between mb-3">
                      <div className="flex items-center gap-2">
                        <div className="w-7 h-7 rounded-lg bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-400 flex items-center justify-center font-bold">
                          <Sparkles className="w-4 h-4" />
                        </div>
                        <h3 className="font-bold text-slate-900 dark:text-white text-sm">Study Break &amp; Trivia</h3>
                      </div>
                      <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-300">
                        +1 Karma
                      </span>
                    </div>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mb-4">
                      Take a 60-second recharge while searching rooms. Test your Dayalbagh heritage and science knowledge!
                    </p>
                    <div className="p-4 rounded-xl bg-gradient-to-br from-emerald-50/60 to-amber-50/60 dark:from-emerald-950/30 dark:to-amber-950/20 border border-emerald-200/60 dark:border-emerald-900/50 text-center mb-4">
                      <div className="text-3xl mb-2 animate-float">
                        {DEI_TRIVIA[triviaIdx].emoji}
                      </div>
                      <p className="text-xs font-semibold text-slate-800 dark:text-slate-200 mb-3">
                        "{DEI_TRIVIA[triviaIdx].q}"
                      </p>
                      {showTriviaAns ? (
                        <div className="p-2.5 rounded-lg bg-white/90 dark:bg-slate-900 border border-emerald-200 dark:border-emerald-800 text-xs text-emerald-800 dark:text-emerald-300 font-medium mb-3 animate-in fade-in">
                          {DEI_TRIVIA[triviaIdx].a}
                        </div>
                      ) : (
                        <button
                          onClick={revealTriviaAnswer}
                          className="mb-3 px-3 py-1 rounded-lg bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-xs font-medium text-slate-700 dark:text-slate-200 shadow-2xs transition-colors"
                        >
                          Reveal Answer &amp; Earn +1 Karma
                        </button>
                      )}
                      <div className="flex justify-center">
                        <button
                          onClick={spinTrivia}
                          className="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold flex items-center gap-1.5 shadow-2xs transition-colors"
                        >
                          <RotateCw className="w-3.5 h-3.5" />
                          <span>Spin Next Brain-Teaser</span>
                        </button>
                      </div>
                    </div>
                    <div className="text-[11px] text-slate-400 flex items-center gap-1.5">
                      <Compass className="w-3.5 h-3.5 text-slate-400" />
                      <span>DEI values: Work is Worship, Karma over Grades.</span>
                    </div>
                  </div>

                  {/* DEI Eco-Champions Leaderboard */}
                  <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-xs transition-colors">
                    <div className="flex items-center justify-between mb-3">
                      <div className="flex items-center gap-2">
                        <div className="w-7 h-7 rounded-lg bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 flex items-center justify-center font-bold">
                          <Award className="w-4 h-4" />
                        </div>
                        <h3 className="font-bold text-slate-900 dark:text-white text-sm">DEI Eco-Champions</h3>
                      </div>
                      <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300">
                        Top Stewards
                      </span>
                    </div>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mb-4">
                      Students earning the highest Green Points by solving maintenance and energy waste.
                    </p>
                    <div className="space-y-2">
                      {ecoChampions.map((champ, index) => {
                        const rankIcons = ['🥇', '🥈', '🥉', '4', '5'];
                        return (
                          <div
                            key={champ.id}
                            className="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/60 transition-colors border border-transparent hover:border-slate-100 dark:hover:border-slate-800"
                          >
                            <div className="flex items-center gap-2.5">
                              <span className="w-6 text-center text-xs font-bold text-slate-500 dark:text-slate-400">
                                {rankIcons[index]}
                              </span>
                              <div>
                                <div className="text-xs font-bold text-slate-800 dark:text-slate-200">{champ.fullName}</div>
                                <div className="text-[10px] text-slate-400 truncate max-w-[150px]">{champ.department}</div>
                              </div>
                            </div>
                            <span className="text-xs font-bold font-mono text-emerald-700 dark:text-emerald-400 tabular-nums">
                              {champ.greenPoints} pts
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Single-File / PHP Export Card */}
                  <div className="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-2xl p-5 shadow-xs border border-slate-800">
                    <div className="flex items-center gap-2 mb-2">
                      <FileCode className="w-4 h-4 text-emerald-400" />
                      <h4 className="font-bold text-sm">Standalone &amp; XAMPP Code</h4>
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed mb-4">
                      Running in zero-build Single-File HTML5 mode. You can also download the PHP/MySQL scripts or save this file offline.
                    </p>
                    <div className="space-y-2">
                      <button
                        onClick={() => setIsDeployModalOpen(true)}
                        className="w-full py-2 px-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs flex items-center justify-center gap-1.5 transition-colors shadow-2xs"
                      >
                        <Rocket className="w-3.5 h-3.5" />
                        <span>Download Single index.html</span>
                      </button>
                      <button
                        onClick={() => setIsCodeModalOpen(true)}
                        className="w-full py-2 px-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-semibold text-xs flex items-center justify-center gap-1.5 transition-colors"
                      >
                        <span>Inspect PHP &amp; SQL Files</span>
                        <ChevronRight className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </main>

            {/* MODALS */}
            {isOfferSkillModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4 animate-in fade-in">
                <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 w-full max-w-md p-6 overflow-hidden">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 mb-4">
                    <h3 className="font-bold text-slate-900 dark:text-white text-base">Offer a Skill in PeerLearn</h3>
                    <button onClick={() => setIsOfferSkillModalOpen(false)} className="text-slate-400 hover:text-slate-700 dark:hover:text-white">
                      <X className="w-5 h-5" />
                    </button>
                  </div>
                  <form onSubmit={handleCreateSkill} className="space-y-4">
                    <div>
                      <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Skill Title</label>
                      <input
                        type="text"
                        value={newSkillTitle}
                        onChange={(e) => setNewSkillTitle(e.target.value)}
                        placeholder="e.g. AutoCAD 3D Drafting & Workshop Prep"
                        className="w-full text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-slate-800 dark:text-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500"
                        required
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Category</label>
                      <select
                        value={newSkillCat}
                        onChange={(e) => setNewSkillCat(e.target.value)}
                        className="w-full text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-slate-800 dark:text-white"
                      >
                        <option value="Coding">Coding &amp; Tech</option>
                        <option value="Academics">Academics &amp; Science</option>
                        <option value="Design">UI/UX &amp; CAD Design</option>
                        <option value="Music/Art">Music &amp; DEI Traditions</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Description</label>
                      <textarea
                        value={newSkillDesc}
                        onChange={(e) => setNewSkillDesc(e.target.value)}
                        rows={3}
                        placeholder="What will you teach during a 1-hour session?"
                        className="w-full text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-slate-800 dark:text-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500"
                        required
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Availability Time</label>
                      <input
                        type="text"
                        value={newSkillAvail}
                        onChange={(e) => setNewSkillAvail(e.target.value)}
                        placeholder="e.g. Wed & Fri: 4:00 PM - 6:00 PM"
                        className="w-full text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-slate-800 dark:text-white"
                        required
                      />
                    </div>
                    <div className="pt-2 flex justify-end gap-2">
                      <button
                        type="button"
                        onClick={() => setIsOfferSkillModalOpen(false)}
                        className="px-4 py-2 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-xs"
                      >
                        Publish Listing
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {isReportModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4 animate-in fade-in">
                <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 w-full max-w-md p-6 overflow-hidden">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 mb-4">
                    <h3 className="font-bold text-slate-900 dark:text-white text-base">Report Campus Issue</h3>
                    <button onClick={() => setIsReportModalOpen(false)} className="text-slate-400 hover:text-slate-700 dark:hover:text-white">
                      <X className="w-5 h-5" />
                    </button>
                  </div>
                  <form onSubmit={handleCreateReport} className="space-y-4">
                    <div>
                      <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Location / Classroom</label>
                      <input
                        type="text"
                        value={newReportLoc}
                        onChange={(e) => setNewReportLoc(e.target.value)}
                        placeholder="e.g. Faculty of Engineering, Room E-202"
                        className="w-full text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-slate-800 dark:text-white"
                        required
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Category</label>
                      <select
                        value={newReportCat}
                        onChange={(e) => setNewReportCat(e.target.value)}
                        className="w-full text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-slate-800 dark:text-white"
                      >
                        <option value="Electrical/Fan">Electrical / Fan Left Running</option>
                        <option value="Water Leakage">Water Leakage / Tap Dripping</option>
                        <option value="Cleanliness">Cleanliness &amp; Waste Segregation</option>
                        <option value="Green Initiative">Green Initiative / Solar Suggestion</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Issue Description</label>
                      <textarea
                        value={newReportDesc}
                        onChange={(e) => setNewReportDesc(e.target.value)}
                        rows={3}
                        placeholder="Explain the maintenance need or energy waste observed..."
                        className="w-full text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-slate-800 dark:text-white"
                        required
                      />
                    </div>
                    <div className="pt-2 flex justify-end gap-2">
                      <button
                        type="button"
                        onClick={() => setIsReportModalOpen(false)}
                        className="px-4 py-2 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-xs"
                      >
                        Submit for +10 Karma
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            <CodeExporterModal
              isOpen={isCodeModalOpen}
              onClose={() => setIsCodeModalOpen(false)}
              fileContents={ALL_CODE_MAP}
            />

            <DeployGuideModal
              isOpen={isDeployModalOpen}
              onClose={() => setIsDeployModalOpen(false)}
              onShowToast={addToast}
            />

            {/* Toast Notifications */}
            <div className="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none">
              {toasts.map(t => (
                <div
                  key={t.id}
                  className={`pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-xs font-semibold flex items-center gap-2 animate-in slide-in-from-bottom-2 duration-200 ${
                    t.type === 'success' ? 'bg-emerald-900 text-white border-emerald-700' :
                    t.type === 'danger' ? 'bg-rose-900 text-white border-rose-700' :
                    t.type === 'warning' ? 'bg-amber-900 text-white border-amber-700' :
                    'bg-slate-900 text-white border-slate-700'
                  }`}
                >
                  {t.type === 'success' && <CheckCircle2 className="w-4 h-4 text-emerald-400" />}
                  {t.type === 'danger' && <AlertTriangle className="w-4 h-4 text-rose-400" />}
                  {t.type === 'warning' && <AlertTriangle className="w-4 h-4 text-amber-400" />}
                  {t.type === 'info' && <Sparkles className="w-4 h-4 text-emerald-300" />}
                  <span>{t.text}</span>
                </div>
              ))}
            </div>

            {/* Footer */}
            <footer className="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 text-xs text-slate-500 dark:text-slate-400 text-center transition-colors">
              <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
                <div className="flex items-center gap-2">
                  <span className="font-semibold text-slate-700 dark:text-slate-200">ONECAMPUS (DEI Edition)</span>
                  <span>·</span>
                  <span>Dayalbagh Educational Institute, Agra</span>
                </div>
                <div className="flex flex-wrap items-center justify-center gap-4">
                  <button
                    onClick={() => setIsDeployModalOpen(true)}
                    className="font-bold text-emerald-600 dark:text-emerald-400 hover:underline flex items-center gap-1"
                  >
                    <Rocket className="w-3.5 h-3.5" />
                    <span>Download Single index.html</span>
                  </button>
                  <span>·</span>
                  <button onClick={() => setIsCodeModalOpen(true)} className="hover:text-emerald-700 dark:hover:text-emerald-300 underline">
                    View PHP &amp; MySQL Code
                  </button>
                  <span>·</span>
                  <span className="italic">"Work is Worship"</span>
                </div>
              </div>
            </footer>

          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
